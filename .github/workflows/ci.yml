name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_PROCESS_TIMEOUT: "0"

jobs:
  composer-validation:
    name: Composer validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/plugins/course-discovery
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, mbstring, xml, xmlwriter, zip
          coverage: none
          tools: composer:2.10.2
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress
      - name: Validate manifest and normalization
        run: composer run composer:validate
      - name: Verify installed platform requirements
        run: composer check-platform-reqs

  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/plugins/course-discovery
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:2.10.2
      - name: Audit locked dependencies
        run: composer run composer:audit

  php-lint:
    name: PHP lint (8.3 minimum)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: none
      - name: Check PHP syntax
        run: find app/plugins/course-discovery examples scripts -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

  coding-standards:
    name: PHPCS / WPCS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/plugins/course-discovery
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:2.10.2
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run WordPress Coding Standards
        run: composer run cs

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/plugins/course-discovery
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: dom, mbstring, xml, xmlwriter
          ini-values: memory_limit=768M
          coverage: none
          tools: composer:2.10.2
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run PHPStan
        run: composer run analyse

  unit-tests:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.4"
          - "8.5"
    defaults:
      run:
        working-directory: app/plugins/course-discovery
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:2.10.2
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run unit tests
        run: composer run test:unit

  integration-tests:
    name: Integration tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.5"
    services:
      mariadb:
        image: mariadb:12.3.2-ubi10
        env:
          MARIADB_DATABASE: wordpress_test
          MARIADB_USER: wordpress_test
          MARIADB_PASSWORD: wordpress_test
          MARIADB_ROOT_PASSWORD: root
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_CORE_DIR: ${{ runner.temp }}/wordpress
      WP_TESTS_DIR: ${{ github.workspace }}/app/plugins/course-discovery/vendor/wp-phpunit/wp-phpunit
      WP_TESTS_DB_HOST: 127.0.0.1:3306
      WP_TESTS_DB_NAME: wordpress_test
      WP_TESTS_DB_USER: wordpress_test
      WP_TESTS_DB_PASSWORD: wordpress_test
      WP_PHPUNIT__TABLE_PREFIX: wptests_
    defaults:
      run:
        working-directory: app/plugins/course-discovery
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, mysqli, xml, xmlwriter
          coverage: none
          tools: composer:2.10.2
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress
      - name: Download and verify WordPress core
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/wordpress.tar.gz" \
            https://wordpress.org/wordpress-7.0.2.tar.gz
          tar --extract --gzip --file="${RUNNER_TEMP}/wordpress.tar.gz" --directory="${RUNNER_TEMP}"
          test -r "${WP_CORE_DIR}/wp-settings.php"
          php -r 'require getenv("WP_CORE_DIR") . "/wp-includes/version.php"; if ("7.0.2" !== $wp_version) { exit(1); }'
      - name: Run integration tests
        run: composer run test:integration
      - name: Run optional example integration tests
        run: >-
          vendor/bin/phpunit --configuration=phpunit.xml.dist
          --bootstrap=tests/bootstrap/integration.php
          ../../../examples/course-discovery-price-ceiling/tests

  feature-tests:
    name: Feature tests (PHP 8.5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:12.3.2-ubi10
        env:
          MARIADB_DATABASE: wordpress_test
          MARIADB_USER: wordpress_test
          MARIADB_PASSWORD: wordpress_test
          MARIADB_ROOT_PASSWORD: root
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_CORE_DIR: ${{ runner.temp }}/wordpress
      WP_TESTS_DIR: ${{ github.workspace }}/app/plugins/course-discovery/vendor/wp-phpunit/wp-phpunit
      WP_TESTS_DB_HOST: 127.0.0.1:3306
      WP_TESTS_DB_NAME: wordpress_test
      WP_TESTS_DB_USER: wordpress_test
      WP_TESTS_DB_PASSWORD: wordpress_test
      WP_PHPUNIT__TABLE_PREFIX: wptests_
    defaults:
      run:
        working-directory: app/plugins/course-discovery
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: dom, mbstring, mysqli, xml, xmlwriter
          coverage: none
          tools: composer:2.10.2
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress
      - name: Download and verify WordPress core
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/wordpress.tar.gz" \
            https://wordpress.org/wordpress-7.0.2.tar.gz
          tar --extract --gzip --file="${RUNNER_TEMP}/wordpress.tar.gz" --directory="${RUNNER_TEMP}"
          test -r "${WP_CORE_DIR}/wp-settings.php"
          php -r 'require getenv("WP_CORE_DIR") . "/wp-includes/version.php"; if ("7.0.2" !== $wp_version) { exit(1); }'
      - name: Run feature tests
        run: composer run test:feature

  javascript-syntax:
    name: Vanilla JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/plugins/course-discovery
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: find assets/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
